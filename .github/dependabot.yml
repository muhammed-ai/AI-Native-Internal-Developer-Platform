version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]

  - package-ecosystem: pip
    directory: "/services/sample-api"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels: [dependencies, python]

  - package-ecosystem: docker
    directory: "/services/sample-api"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels: [dependencies, docker]

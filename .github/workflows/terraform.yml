name: Terraform validation

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

# ACTIVE (Phase 2). Validates formatting and runs init/validate on the Azure stack
# with the backend disabled. No cloud credentials are used and no apply is run.
jobs:
  fmt-validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive terraform/

      - name: Validate azure stack
        run: |
          terraform -chdir=terraform/azure init -backend=false -input=false
          terraform -chdir=terraform/azure validate -no-color

  iac-security:
    name: IaC security scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov on terraform/
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          quiet: true
          soft_fail: true # report findings without blocking; tighten in a later phase
